<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LiveKit Demo - Transmissão</title>
    <link rel="stylesheet" href="css/room.css">
  </head>
  <body>
    <main class="room-container" style="grid-template-columns:1fr;max-width:980px;margin:18px auto;">
      <section class="stage">
        <h2>LiveKit - Transmitir tela (Exemplo)</h2>
        <div style="display:flex;gap:12px;align-items:center;margin:12px 0;">
          <input id="identity" placeholder="Seu nome" />
          <input id="roomName" placeholder="Nome da sala (ex: demo)" />
          <select id="lkQuality">
            <option value="auto">Automática</option>
            <option value="high">Alta (1080p)</option>
            <option value="medium">Média (720p)</option>
            <option value="low">Baixa (480p)</option>
          </select>
          <label><input type="checkbox" id="lkAudio" checked /> Compartilhar áudio</label>
          <button id="lkConnect" class="btn primary">Conectar & Transmitir</button>
          <button id="lkStop" class="btn danger hidden">Parar</button>
        </div>

        <div id="lkStatus">Desconectado</div>
        <div id="lkPreview" style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;"></div>
      </section>
    </main>

    <script type="module" src="js/livekit.js"></script>
  </body>
</html>
