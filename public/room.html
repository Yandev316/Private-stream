<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Private Stream - Sala</title>
    <link rel="stylesheet" href="css/room.css">
  </head>
  <body>
    <div id="pageLoader" class="page-loader">
      <div class="loader-inner">
        <div class="spinner"></div>
        <div class="loader-text">Carregando sala...</div>
      </div>
    </div>
    <header class="topbar">
      <div class="brand">Private Stream</div>
      <div class="room-info">
        <span class="room-label-inline">Sala: <strong id="roomCode">XXXXXX</strong></span>
        <button id="copyBtn" class="btn icon">Copiar código</button>
        <span id="copyConfirm" class="copy-confirm" aria-hidden="true"></span>
      </div>
      <div class="actions"><button id="leaveBtn" class="btn danger">Sair</button></div>
    </header>

    <main class="room-container">
      <section class="stage">
        <div class="stage-header">
          <div>
            <div id="status" class="status">Nenhuma transmissão ativa</div>
            <div class="room-label">Sala: <strong class="room-code-inline">XXXXXX</strong></div>
          </div>
          <div class="stage-actions">
            <button id="fullscreenBtn" class="btn icon">Tela cheia</button>
          </div>
        </div>

        <div id="videoCard" class="video-card">
          <div class="video-topbar">
            <span id="liveBadge" class="live hidden">● AO VIVO</span>
            <span id="streamerName" class="streamer-name"></span>
            <div id="qualityLabel" class="quality-label-inline" style="margin-left:12px;color:#9fb0d9"></div>
          </div>
          <div id="videoArea" class="video-area">
            <div id="placeholder" class="placeholder">Nenhuma transmissão ativa</div>
            <div class="preview-wrap">
              <video id="localPreview" autoplay muted playsinline class="local-preview hidden"></video>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
          </div>
          <div class="controls">
            <div class="control-group">
              <label for="qualitySelect" class="quality-label">Qualidade</label>
              <select id="qualitySelect" class="quality-select" aria-label="Selecionar qualidade da transmissão">
                <option value="auto">Automática</option>
                <option value="high">Alta (1080p)</option>
                <option value="medium">Média (720p)</option>
                <option value="low">Baixa (480p)</option>
              </select>
            </div>
            <div class="control-group">
              <label for="fitMode" class="quality-label">Ajuste</label>
              <select id="fitMode" class="quality-select" aria-label="Modo de ajuste">
                <option value="contain">Adaptar (sem cortar)</option>
                <option value="cover">Preencher (pode cortar)</option>
                <option value="stretch">Esticar (preencher distorcendo)</option>
              </select>
            </div>
            <div class="control-group">
              <label class="checkbox"><input type="checkbox" id="scaleDownLarge" checked /> Reduzir telas grandes (safe 4K)</label>
            </div>
            <div class="control-group">
              <label class="checkbox"><input type="checkbox" id="shareAudio" checked /> Compartilhar áudio</label>
            </div>
            <div class="control-group">
              <button id="muteBtn" class="btn icon">Desativar áudio</button>
            </div>
            <div class="control-group small">
              <div class="preset-row">
                <button class="btn preset" data-q="high">1080p</button>
                <button class="btn preset" data-q="medium">720p</button>
                <button class="btn preset" data-q="low">480p</button>
              </div>
            </div>
            <button id="startBtn" class="btn primary">Transmitir tela</button>
            <button id="stopBtn" class="btn danger hidden">Parar transmissão</button>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-header">
          <h3>Usuários online</h3>
          <div id="userCount" class="count-bubble">0</div>
        </div>
        <ul id="usersList" class="users"></ul>
      </aside>
    </main>

    <template id="userTpl">
      <li class="user-item">
        <div class="avatar"></div>
        <div class="user-info">
          <div class="name"></div>
          <div class="meta"></div>
        </div>
        <div class="user-actions"></div>
      </li>
    </template>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/room.js"></script>
  </body>
</html>
